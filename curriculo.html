<!DOCTYPE html>
<html lang="es">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome Icons -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        sec1: { light: '#3B82F6', dark: '#60A5FA', bg: '#EFF6FF', darkBg: '#1E293B' },

    <style>
        /* Custom smooth accordion transitions */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease-in-out;
            opacity: 0;
        }

        .accordion-content.expanded {
            opacity: 1;
        }

        .chevron-icon {
            transition: transform 0.3s ease;
        }

        .expanded > div > .chevron-icon,
        .is-open > div > div > .chevron-icon,
        .is-open > button > .chevron-icon {
            transform: rotate(180deg);
        }

        mark {
            background-color: #FDE047;
            color: #000;
            padding: 0.1em 0.2em;
            border-radius: 0.2em;
        }

        .dark mark {
            background-color: #CA8A04;
            color: #FFF;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200 font-sans pb-16">

                        </span>

                    </div>

                    </h1>

                    </p>
                </div>
                
                <!-- Dark Mode Toggle Button -->
                <button id="themeToggle" class="p-3 rounded-xl bg-white/10 hover:bg-white/20 backdrop-blur-md transition-all border border-white/20 flex items-center gap-2 text-sm font-medium self-end md:self-center">

                </button>
            </div>
        </div>
    </header>

    <!-- Control Bar -->
    <main class="max-w-6xl mx-auto px-4 -mt-6 relative z-20">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-4 sm:p-6 border border-slate-200/80 dark:border-slate-700/80 transition-colors">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                
                <!-- Search Input -->
                <div class="relative w-full md:w-1/2">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Buscar palabras clave, códigos (ej. TICO.2.C.1) o contenidos..." 
                        class="w-full pl-11 pr-10 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm">
                    <button id="clearSearch" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">

                    </button>
                </div>

                <!-- Global Toggle Buttons -->
                <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                    <button id="expandAllBtn" class="flex-1 md:flex-none px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-angles-down text-indigo-500"></i>
                        <span>Expandir todo</span>
                    </button>
                    <button id="collapseAllBtn" class="flex-1 md:flex-none px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-2">

                        <span>Contraer todo</span>
                    </button>
                </div>

            </div>

            <!-- Search Status Bar -->

                <span id="noResultsMsg" class="hidden text-amber-600 dark:text-amber-400 font-medium">No se encontraron resultados para la búsqueda.</span>
            </div>
        </div>

        <!-- Curriculum Accordion Container -->
        <div id="curriculumTree" class="mt-8 space-y-4">
            <!-- Dynamic Content Generated via JavaScript -->
        </div>
    </main>

        // Render Function
        function renderCurriculum() {
            const container = document.getElementById('curriculumTree');
            container.innerHTML = '';

            curriculumData.forEach(section => {
                const sectionEl = document.createElement('div');
                sectionEl.className = `bg-white dark:bg-slate-800 rounded-2xl shadow-md border-l-4 ${section.borderColor} border-t border-r border-b border-slate-200/80 dark:border-slate-700/80 overflow-hidden transition-all duration-200 section-card`;
                sectionEl.dataset.id = section.id;

                // Level 1 Header Button
                sectionEl.innerHTML = `
                    <button class="w-full p-5 sm:p-6 text-left flex items-start justify-between gap-4 focus:outline-none group cursor-pointer level1-btn" onclick="toggleAccordion('${section.id}')">
                        <div class="flex items-start gap-4">
                            <span class="${section.badgeColor} text-white font-bold rounded-xl w-10 h-10 flex items-center justify-center shrink-0 shadow-sm group-hover:scale-105 transition-transform">
                                ${section.num}
                            </span>
                            <div>
                                <h2 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white group-hover:${section.accentText} transition-colors">
                                    ${section.num}. ${section.title}
                                </h2>
                                <p class="text-slate-600 dark:text-slate-400 text-sm mt-1 line-clamp-2 sm:line-clamp-none font-normal">
                                    ${section.description}
                                </p>
                            </div>
                        </div>
                        <div class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700/50 text-slate-500 dark:text-slate-400 group-hover:bg-slate-200 dark:group-hover:bg-slate-700 transition">
                            <i class="fa-solid fa-chevron-down chevron-icon"></i>
                        </div>
                    </button>
                    
                    <!-- Level 1 Accordion Content -->
                    <div id="content-${section.id}" class="accordion-content">
                        <div class="p-5 sm:p-6 pt-0 border-t border-slate-100 dark:border-slate-700/60 space-y-4 mt-2">
                            ${renderCriteria(section.criteria, section)}
                        </div>
                    </div>
                `;
                container.appendChild(sectionEl);
            });
        }

        // Render Level 2 (Criteria)
        function renderCriteria(criteriaList, section) {
            return criteriaList.map(crit => {
                const critId = `crit-${crit.code.replace('.', '-')}`;
                return `
                    <div class="bg-slate-50/80 dark:bg-slate-900/40 rounded-xl border border-slate-200/60 dark:border-slate-700/50 overflow-hidden criterion-card" data-id="${critId}">
                        <button class="w-full p-4 text-left flex items-center justify-between gap-3 hover:bg-slate-100/50 dark:hover:bg-slate-800/50 transition cursor-pointer level2-btn" onclick="toggleAccordion('${critId}')">
                            <div class="flex items-center gap-3">
                                <span class="bg-indigo-100 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-300 text-xs font-bold px-2.5 py-1 rounded-lg border border-indigo-200 dark:border-indigo-800 shrink-0">
                                    Criterio ${crit.code}
                                </span>
                                <span class="text-sm font-semibold text-slate-800 dark:text-slate-200">
                                    ${crit.title}
                                </span>
                                <span class="text-sm font-semibold text-slate-800 dark:text-slate-200">
                                    <a href="${crit.link}" target="_blank">${crit.link}</a>
                                </span>

                            </div>
                            <i class="fa-solid fa-chevron-down text-xs text-slate-400 chevron-icon shrink-0"></i>
                        </button>
                        
                        <!-- Level 2 Accordion Content -->
                        <div id="content-${critId}" class="accordion-content">
                            <div class="p-4 pt-2 border-t border-slate-200/50 dark:border-slate-700/40 space-y-4">
                                ${renderBlocks(crit.blocks, section)}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render Level 3 (TICO Content Blocks & Items)
        function renderBlocks(blocks, section) {
            return blocks.map(block => {
                return `
                    <div class="space-y-3">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-mono">
                                ${block.code}
                            </span>
                            <h4 class="text-sm font-bold text-slate-900 dark:text-slate-100">
                                ${block.title}
                            </h4>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pl-2">
                            ${block.items.map(item => `
                                <div class="p-3 rounded-lg bg-white dark:bg-slate-800 border border-slate-200/70 dark:border-slate-700/70 shadow-sm flex items-start gap-2.5 hover:border-indigo-300 dark:hover:border-indigo-700 transition content-item">
                                    <span class="text-[11px] font-mono font-semibold px-2 py-0.5 rounded ${section.accentBg} ${section.accentText} shrink-0 mt-0.5">
                                        ${item.code}
                                    </span>
                                    <span class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-snug">
                                        ${item.text}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Accordion Toggle Core Function
        function toggleAccordion(id) {
            const content = document.getElementById(`content-${id}`);
            if (!content) return;

            const isExpanded = content.classList.contains('expanded');
            const button = content.previousElementSibling;

            if (isExpanded) {
                content.style.maxHeight = '0px';
                content.classList.remove('expanded');
                if (button) button.classList.remove('is-open');
            } else {
                content.classList.add('expanded');
                content.style.maxHeight = content.scrollHeight + 'px';
                if (button) button.classList.add('is-open');

                // Adjust parent accordion height if nested
                let parentAccordion = content.parentElement.closest('.accordion-content');
                while (parentAccordion) {
                    parentAccordion.style.maxHeight = parentAccordion.scrollHeight + content.scrollHeight + 'px';
                    parentAccordion = parentAccordion.parentElement.closest('.accordion-content');
                }
            }
        }

        // Expand All Functionality
        function expandAll() {
            document.querySelectorAll('.accordion-content').forEach(content => {
                content.classList.add('expanded');
                content.style.maxHeight = '2000px';
                if (content.previousElementSibling) {
                    content.previousElementSibling.classList.add('is-open');
                }
            });
        }

        // Collapse All Functionality
        function collapseAll() {
            document.querySelectorAll('.accordion-content').forEach(content => {
                content.style.maxHeight = '0px';
                content.classList.remove('expanded');
                if (content.previousElementSibling) {
                    content.previousElementSibling.classList.remove('is-open');
                }
            });
        }

        // Real-Time Live Search and Highlight
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const clearBtn = document.getElementById('clearSearch');
            const statsBar = document.getElementById('searchStats');
            const matchCountEl = document.getElementById('matchCount');
            const noResultsMsg = document.getElementById('noResultsMsg');

            if (query === '') {
                clearBtn.classList.add('hidden');
                statsBar.classList.add('hidden');
                renderCurriculum(); // Reset view
                return;
            }

            clearBtn.classList.remove('hidden');
            statsBar.classList.remove('hidden');

            let totalMatches = 0;

            // Loop through sections
            curriculumData.forEach(sec => {
                const secEl = document.querySelector(`[data-id="${sec.id}"]`);
                let secHasMatch = false;

                // Check section title/desc
                if (sec.title.toLowerCase().includes(query) || sec.description.toLowerCase().includes(query) || sec.num.includes(query)) {
                    secHasMatch = true;
                    totalMatches++;
                }

                sec.criteria.forEach(crit => {
                    const critId = `crit-${crit.code.replace('.', '-')}`;
                    const critEl = document.querySelector(`[data-id="${critId}"]`);
                    let critHasMatch = false;

                    if (crit.title.toLowerCase().includes(query) || crit.code.toLowerCase().includes(query)) {
                        critHasMatch = true;
                        secHasMatch = true;
                        totalMatches++;
                    }

                    crit.blocks.forEach(block => {
                        if (block.title.toLowerCase().includes(query) || block.code.toLowerCase().includes(query)) {
                            critHasMatch = true;
                            secHasMatch = true;
                            totalMatches++;
                        }

                        block.items.forEach(item => {
                            if (item.text.toLowerCase().includes(query) || item.code.toLowerCase().includes(query)) {
                                critHasMatch = true;
                                secHasMatch = true;
                                totalMatches++;
                            }
                        });
                    });

                    // Hide/Show Criteria based on match
                    if (critEl) {
                        if (critHasMatch) {
                            critEl.classList.remove('hidden');
                            // Automatically expand criterion content
                            const critContent = document.getElementById(`content-${critId}`);
                            if (critContent) {
                                critContent.classList.add('expanded');
                                critContent.style.maxHeight = '2000px';
                                if (critContent.previousElementSibling) critContent.previousElementSibling.classList.add('is-open');
                            }
                        } else {
                            critEl.classList.add('hidden');
                        }
                    }
                });

                // Hide/Show Section based on match
                if (secEl) {
                    if (secHasMatch) {
                        secEl.classList.remove('hidden');
                        // Automatically expand section content
                        const secContent = document.getElementById(`content-${sec.id}`);
                        if (secContent) {
                            secContent.classList.add('expanded');
                            secContent.style.maxHeight = '5000px';
                            if (secContent.previousElementSibling) secContent.previousElementSibling.classList.add('is-open');
                        }
                    } else {
                        secEl.classList.add('hidden');
                    }
                }
            });

            matchCountEl.textContent = totalMatches;
            if (totalMatches === 0) {
                noResultsMsg.classList.remove('hidden');
            } else {
                noResultsMsg.classList.add('hidden');
            }
        }

        // Theme Toggle (Dark / Light Mode)
        function setupTheme() {
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');

            const isDark = localStorage.getItem('theme') === 'dark' || 
                (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);

            if (isDark) {
                document.documentElement.classList.add('dark');
                themeIcon.className = 'fa-solid fa-sun';
                themeText.textContent = 'Modo Claro';
            } else {
                document.documentElement.classList.remove('dark');
                themeIcon.className = 'fa-solid fa-moon';
                themeText.textContent = 'Modo Oscuro';
            }

            themeToggle.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                    themeIcon.className = 'fa-solid fa-moon';
                    themeText.textContent = 'Modo Oscuro';
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                    themeIcon.className = 'fa-solid fa-sun';
                    themeText.textContent = 'Modo Claro';
                }
            });
        }

        // Initialize App on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            renderCurriculum();
            setupTheme();

            // Event Listeners
            document.getElementById('expandAllBtn').addEventListener('click', expandAll);
            document.getElementById('collapseAllBtn').addEventListener('click', collapseAll);

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', handleSearch);

            document.getElementById('clearSearch').addEventListener('click', () => {
                searchInput.value = '';
                handleSearch();
                searchInput.focus();
            });
        });
    </script>
</body>
