site_name: Tecnologías de la Información y la Comunicación 2
site_description: Tecnologías de la Información y la Comunicación 2
site_url: https://alejandrogomezcuesta.github.io/tic2/
repo_url: https://github.com/alejandrogomezcuesta/tic2
repo_name: alejandrogomezcuesta/tic2
site_dir: site
docs_dir: docs
strict: true

theme:
  name: material
  language: es
  features:
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select 
    - content.code.annotate
    - toc.follow
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro

plugins:
  - search:
      lang:
        - es

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.esm.min.mjs
  - peliculas/javascripts/peliculas.js

extra_css:
  - peliculas/stylesheets/peliculas.css

